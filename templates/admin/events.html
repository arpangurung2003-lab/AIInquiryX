{% extends "admin/base_admin.html" %}
{% block content %}<div class="admin-title">
    <h1>Events</h1>
    <p>Add and manage upcoming support events.</p>
</div>
<section class="admin-card">
    <form method="POST" class="event-admin-form" data-loading-form><input type="hidden" name="csrf_token"
            value="{{ csrf_token }}"><input name="title" placeholder="Event title" required><input name="event_date"
            type="date" required><input name="location" placeholder="Location"><select name="status">
            <option>Upcoming</option>
            <option>Completed</option>
            <option>Cancelled</option>
        </select><textarea name="description" placeholder="Description" required></textarea><button
            class="btn btn-primary">Add Event</button></form>
</section>
<section class="admin-card">
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Title</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>{% for event in events %}<tr>
                    <td>{{ event.event_date.strftime('%d %b %Y') }}</td>
                    <td>{{ event.title }}</td>
                    <td>{{ event.location }}</td>
                    <td><span class="badge status-pending">{{ event.status }}</span></td>
                    <td>
                        <form method="POST" action="{{ url_for('admin_delete_event', event_id=event.id) }}"
                            onsubmit="return confirm('Delete this event?')"><input type="hidden" name="csrf_token"
                                value="{{ csrf_token }}"><button class="danger-small">Delete</button></form>
                    </td>
                </tr>{% endfor %}</tbody>
        </table>
    </div>
</section>{% endblock %}
